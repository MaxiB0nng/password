{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3>Welcome, {{ user.username }}!</h3>
    </div>
    <div class="card-body">
        <h5>Your Profile Information:</h5>
        <p>Username: {{ user.username }}</p>
        <p>Email: {{ user.email }}</p>
        <p>2FA Method: {{ user.two_factor_type }}</p>
    </div>
</div>
{% endblock %}
