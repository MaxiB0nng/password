{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Setup Authenticator App</h3>
            </div>
            <div class="card-body text-center">
                <p>1. Open your authenticator app (Google/Microsoft Authenticator)</p>
                <p>2. Scan this QR code:</p>
                <img src="data:image/png;base64,{{ qr_code }}" class="mb-3">
                <p>Or manually enter this code: <code>{{ secret }}</code></p>
                <form method="POST" action="{{ url_for('verify_2fa') }}">
                    <div class="mb-3">
                        <label class="form-label">3. Enter the 6-digit code shown in your app:</label>
                        <input type="text" name="code" class="form-control" required 
                               pattern="[0-9]{6}" title="Please enter a 6-digit code">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify and Complete Setup</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
