{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Setup Two-Factor Authentication</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Choose 2FA Method:</label>
                        <select name="2fa_type" class="form-select" required>
                            <option value="email">Email Authentication</option>
                            <option value="authenticator">Authenticator App (Google/Microsoft)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Continue Setup</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
